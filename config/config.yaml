# 配置模板文件；启动服务时请通过 -f 指定实际配置文件路径。
# HTTP 服务配置。
server:
  # 服务监听端口。
  port: 8080
  # 服务监听地址；0.0.0.0 表示监听所有网卡。
  host: 0.0.0.0

# 日志服务配置。
logger:
  # 日志等级；支持 debug、info、warn、error，也支持 slog 数值等级。
  level: info
  # 日志格式；支持 text、json。
  format: text
  # 是否记录源码文件和行号。
  add_source: false
  # 控制台日志输出配置。
  console:
    # 是否输出日志到控制台。
    enabled: true
  # 文件日志输出配置。
  file:
    # 是否输出日志到文件。
    enabled: false
    # 日志文件存放目录。
    dir: logs
    # 日志文件基础名称，实际文件名会自动追加时间片后缀。
    filename: app.log
    # 文件按时间轮转的粒度；支持 daily、hourly、monthly。
    rotation: daily

# 登录鉴权配置。
auth:
  # 系统登录密码；只需要密码，不需要账号。
  password: admin123

# 文件对象存储配置。
storage:
  # S3 兼容对象存储配置，用于保存小说封面和人物图片。
  s3:
    # 对象存储服务地址，不包含 bucket 名称，例如：s3.example.com 或 localhost:9000。
    endpoint: ""
    # 服务端访问对象存储使用的 access key。
    access_key: ""
    # 服务端访问对象存储使用的 secret key，请勿提交真实密钥。
    secret_key: ""
    # 图片对象保存的 bucket 名称，bucket 需要提前创建。
    bucket: ""
    # bucket 所在区域；MinIO 或部分兼容存储可留空。
    region: ""
    # 是否使用 HTTPS 连接对象存储。
    use_ssl: false
    # bucket 寻址方式；支持 auto、dns、path。
    bucket_lookup: auto
    # 上传成功后返回的预签名预览链接有效期。
    preview_expire: 24h
    # 单个图片允许上传的最大大小，单位为 MB。
    max_upload_size_mb: 20
    # 小说封面图片对象 key 的前缀。
    cover_prefix: covers
    # 人物图片对象 key 的前缀。
    character_prefix: characters

# 数据库配置。
database:
  # MySQL 数据库连接配置。
  mysql:
    # MySQL 服务地址。
    host: ""
    # MySQL 服务端口。
    port: 
    # MySQL 登录用户名。
    username: 
    # MySQL 登录密码。
    password: 
    # MySQL 数据库名称。
    dbname: 
  
  # PostgreSQL 数据库连接配置。
  postgres:
    # PostgreSQL 服务地址。
    host: ""
    # PostgreSQL 服务端口。
    port: 
    # PostgreSQL 登录用户名。
    username: 
    # PostgreSQL 登录密码。
    password: 
    # PostgreSQL 数据库名称。
    dbname: 
  
ai:
  # AI 提供商 API Key 的应用层加密密钥；可填写任意非空字符串。
  # 可通过环境变量 AI_PROVIDER_SECRET_KEY 覆盖；修改后旧密钥加密的数据将无法解密。
  provider_secret_key: "46468"
  # 全局提示词类型库，用于提示词库分类。
  prompt_types:
    - 润色
    - 情感
    - 扩写
  # 小说写作多层 Agent 配置。
  agent:
    # Agent 普通工具注册表；Agent 配置中的 tools 字段只能引用这里定义的 name。
    tools:
      - name: get_content
        description: |-
          读取当前请求关联章节的标题、正文、总结、字数和更新时间。当需要当前章节全文时调用。

          **返回的JSON字段详解：**
          chapter_number: 当前章节号，例如第 10 章就是 10。
          title: 当前章节标题。
          content: 当前章节正文全文。
          summary: 当前章节总结，可能为空字符串。
          word_count: 当前章节正文的非空白字符数。
          updated_at: 当前章节最近更新时间。
      - name: query_chapters
        description: |-
          按小说 ID 查询章节数据，可按章节 ID、章节号或章节号范围查询，并可通过 fields 只返回正文、总结等指定字段。
          像created_at、updated_at等字段，非必要不获取。

          **fields列表字段解释：**
          "id": 主键ID,
          "novel_id": 小说ID,
          "chapter_number": 章节号，代表是第几章,
          "title": 章节标题,
          "content": 章节正文,
          "summary": 当前章节的剧情概要,
          "word_count": 章节字数,
          "created_at": 章节创建时间,
          "updated_at": 修改时间,

          **返回的JSON字段详解：**
          novel_id: 本次查询实际使用的小说 ID。
          count: 本次查询命中的章节数量。
          fields: 本次实际返回的字段名列表。
          chapters: 查询到的章节数组。

          chapters[] 内字段说明：
          id: 章节主键 ID。
          novel_id: 章节所属小说 ID。
          chapter_number: 章节号。
          title: 章节标题。
          content: 章节正文全文。
          summary: 章节总结，可能为空字符串。
          word_count: 章节正文的非空白字符数。
          created_at: 章节创建时间。
          updated_at: 章节最近更新时间。
      - name: update_chapter_summary
        description: |-
          根据小说 ID 和章节 ID 或章节号更新章节总结；只能修改 summary 字段。

          **返回的JSON字段详解：**
          id: 被更新的章节主键 ID。
          novel_id: 章节所属小说 ID。
          chapter_number: 被更新的章节号。
          title: 被更新的章节标题。
          summary: 更新后的章节总结，可能为空字符串，空字符串表示已清空总结。
          updated_at: 章节更新后的最近更新时间。
      - name: query_novel_summary
        description: |-
          查询指定小说的滚动剧情总结，并返回当前总结覆盖的起始章节号和结束章节号；未传 novel_id 时使用当前 Agent 请求关联的小说 ID。

          **返回的JSON字段详解：**
          novel_id: 本次查询实际使用的小说 ID。
          exists: 是否已经存在小说滚动总结。true 表示存在，false 表示还没有创建。
          summary: 小说滚动总结详情。仅当 exists=true 时返回。

          summary 内字段说明：
          id: 小说总结记录主键 ID。
          novel_id: 总结所属小说 ID。
          content: 小说滚动剧情总结正文，可能为空字符串。
          start_chapter_number: 当前总结覆盖的起始章节号。0 表示未知或未记录。
          end_chapter_number: 当前总结覆盖的结束章节号。0 表示未知或未记录。
          created_at: 小说总结记录创建时间。
          updated_at: 小说总结最近更新时间。

          范围规则：start_chapter_number=0 且 end_chapter_number=0 表示当前总结没有记录覆盖章节范围。正常范围应理解为“总结内容覆盖第 start_chapter_number 章到第 end_chapter_number 章”。
      - name: update_novel_summary
        description: |-
          根据小说 ID 写入或覆盖小说滚动剧情总结，可同时写入总结覆盖的起始章节号和结束章节号；只能修改总结内容和章节范围字段。

          **返回的JSON字段详解：**
          id: 小说总结记录主键 ID。
          novel_id: 总结所属小说 ID。
          content: 更新后的小说滚动剧情总结正文，可能为空字符串。
          start_chapter_number: 更新后的总结覆盖起始章节号。0 表示未知或未记录。
          end_chapter_number: 更新后的总结覆盖结束章节号。0 表示未知或未记录。
          created_at: 小说总结记录创建时间。
          updated_at: 小说总结最近更新时间。

          范围规则：start_chapter_number=0 且 end_chapter_number=0 表示当前总结没有记录覆盖章节范围。正常范围应理解为“总结内容覆盖第 start_chapter_number 章到第 end_chapter_number 章”。
      - name: query_novel_outline
        description: |-
          根据小说 ID 查询小说大纲正文；未传 novel_id 时使用当前 Agent 请求关联的小说 ID。

          **返回值说明：**
          工具直接返回字符串，不返回 JSON。返回的字符串就是小说大纲正文全文。
          如果该小说还没有创建大纲，则返回空字符串。
      - name: update_novel_outline
        description: |-
          根据小说 ID 写入或覆盖小说大纲正文；未传 novel_id 时使用当前 Agent 请求关联的小说 ID。该工具只能修改大纲 content 字段，不能修改小说或大纲的其他字段。

          **返回值说明：**
          工具直接返回字符串，不返回 JSON。返回的字符串就是保存后的小说大纲正文全文。
          content 允许为空字符串，表示清空大纲正文。
      - name: list_characters
        description: |-
          分页读取指定小说的角色核心设定，每页固定 5 个，按角色 ID 升序返回，并返回当前页、每页数量、总数和总页数。

          **返回的JSON字段详解：**
          novel_id: 本次查询实际使用的小说 ID。
          page: 当前页码。
          page_size: 每页固定返回数量，当前固定为 5。
          total: 指定小说下的角色总数。
          total_pages: 指定小说下的角色总页数。
          characters: 当前页角色列表。

          characters[] 内字段说明：
          id: 角色卡主键 ID。
          novel_id: 角色所属小说 ID。
          name: 角色姓名。
          gender: 角色性别，可能为空字符串。
          tags: 角色标签，可能为空字符串，多个标签通常用英文逗号分隔。
          background: 角色背景，可能为空字符串。
          personality: 角色性格，可能为空字符串。
          ability: 角色能力，可能为空字符串。
          goal: 角色目的，可能为空字符串。
      - name: search_characters_by_name
        description: |-
          按小说 ID 和角色名精确搜索角色核心设定；允许存在重名角色，命中时返回角色列表。

          **返回的JSON字段详解：**
          novel_id: 本次查询实际使用的小说 ID。
          count: 本次搜索命中的角色数量。
          characters: 命中的角色列表；字段含义与 list_characters 的 characters[] 相同。
      - name: save_character
        description: |-
          新增或更新指定小说下的角色核心设定；id 为 0 或不传时新增，id 大于 0 时更新，只写入姓名、性别、标签、背景、性格、能力和目的字段。

          **返回的JSON字段详解：**
          character: 新增或更新后的角色核心设定。

          character 内字段说明：
          id: 角色卡主键 ID。
          novel_id: 角色所属小说 ID。
          name: 角色姓名。
          gender: 角色性别，可能为空字符串。
          tags: 角色标签，可能为空字符串，多个标签通常用英文逗号分隔。
          background: 角色背景，可能为空字符串。
          personality: 角色性格，可能为空字符串。
          ability: 角色能力，可能为空字符串。
          goal: 角色目的，可能为空字符串。
    # 小说级 Agent 记忆配置。
    memory:
      # 每次请求注入模型上下文的最近对话轮数；一轮为用户消息 + AI 回复。
      recent_rounds: 10
    # 上游模型失败重试配置。
    retry:
      # 单次模型调用失败后的最大重试次数；0 表示不重试。
      max_retries: 0
      # 每次重试前等待的毫秒数；max_retries 为 0 时不生效。
      backoff_ms: 300
    # 顶层 Agent 配置；顶层 Agent 不放入子 Agent 数组。
    supervisor:
      name: novel_supervisor
      provider_id: 0
      model: ""
      description: 负责理解用户意图，并决定直接回答或调用小说写作子 Agent。
      instruction: |
        你是小说写作智能体的顶层 Agent，负责理解用户意图并决定下一步行动。
        你需要根据用户当前问题提供清晰、有帮助的小说写作建议或结果。
      max_iterations: 8
      tools: []
    # 子 Agent 配置列表；每个子 Agent 会作为工具提供给顶层 Agent 调用。
    agent:
      - name: polish
        enabled: true
        share_chat_history: false
        provider_id: 0
        model: ""
        task: polish
        description: 负责小说章节正文润色的机器人工具，用户需要对小说、句子等进行润色时使用。但仅支持润色，不支持扩写、续写等功能。
        instruction: |
          请对以下文本进行情感增强处理:
          1. 添加情绪化的词汇和表达
          2. 在关键点增加感叹和疑问
          3. 适当使用强调语气和夸张修辞
          4. 在文章中创造情感起伏,而非始终平铺直叙
          5. 保持核心信息不变
          如需章节正文，请调用 get_content。
        max_iterations: 6
        tools:
          - get_content
        parameters:
          user_requirement:
            type: string
            description: 用户对润色方向、语气、节奏或氛围的要求，将用户的原文直接作为入参，不允许AI有任何的修改。
            required: true
