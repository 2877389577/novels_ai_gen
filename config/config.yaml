# 配置模板文件；启动服务时请通过 -f 指定实际配置文件路径。
# HTTP 服务配置。
server:
  # 服务监听端口。
  port: 8080
  # 服务监听地址；0.0.0.0 表示监听所有网卡。
  host: 0.0.0.0

# 日志服务配置。
logger:
  # 日志等级；支持 debug、info、warn、error，也支持 slog 数值等级。
  level: info
  # 日志格式；支持 text、json。
  format: text
  # 是否记录源码文件和行号。
  add_source: false
  # 控制台日志输出配置。
  console:
    # 是否输出日志到控制台。
    enabled: true
  # 文件日志输出配置。
  file:
    # 是否输出日志到文件。
    enabled: false
    # 日志文件存放目录。
    dir: logs
    # 日志文件基础名称，实际文件名会自动追加时间片后缀。
    filename: app.log
    # 文件按时间轮转的粒度；支持 daily、hourly、monthly。
    rotation: daily

# 登录鉴权配置。
auth:
  # 系统登录密码；只需要密码，不需要账号。
  password: admin123

# 文件对象存储配置。
storage:
  # S3 兼容对象存储配置，用于保存小说封面和人物图片。
  s3:
    # 对象存储服务地址，不包含 bucket 名称，例如：s3.example.com 或 localhost:9000。
    endpoint: ""
    # 服务端访问对象存储使用的 access key。
    access_key: ""
    # 服务端访问对象存储使用的 secret key，请勿提交真实密钥。
    secret_key: ""
    # 图片对象保存的 bucket 名称，bucket 需要提前创建。
    bucket: ""
    # bucket 所在区域；MinIO 或部分兼容存储可留空。
    region: ""
    # 是否使用 HTTPS 连接对象存储。
    use_ssl: false
    # bucket 寻址方式；支持 auto、dns、path。
    bucket_lookup: auto
    # 上传成功后返回的预签名预览链接有效期。
    preview_expire: 24h
    # 单个图片允许上传的最大大小，单位为 MB。
    max_upload_size_mb: 20
    # 小说封面图片对象 key 的前缀。
    cover_prefix: covers
    # 人物图片对象 key 的前缀。
    character_prefix: characters

# 数据库配置。
database:
  # MySQL 数据库连接配置。
  mysql:
    # MySQL 服务地址。
    host: ""
    # MySQL 服务端口。
    port: 
    # MySQL 登录用户名。
    username: 
    # MySQL 登录密码。
    password: 
    # MySQL 数据库名称。
    dbname: 
  
  # PostgreSQL 数据库连接配置。
  postgres:
    # PostgreSQL 服务地址。
    host: ""
    # PostgreSQL 服务端口。
    port: 
    # PostgreSQL 登录用户名。
    username: 
    # PostgreSQL 登录密码。
    password: 
    # PostgreSQL 数据库名称。
    dbname: 
  
ai:
  # AI 提供商 API Key 的应用层加密密钥；可填写任意非空字符串。
  # 可通过环境变量 AI_PROVIDER_SECRET_KEY 覆盖；修改后旧密钥加密的数据将无法解密。
  provider_secret_key: "46468"
  prompt:
    # 顶层 Agent 任务调度提示词。
    router:
      prompt: |
        你是小说写作智能体的顶层 Agent，负责理解用户意图并决定下一步行动。
        你可以直接回答用户，也可以调用可用工具完成更专业的写作任务。
        可用子 Agent 工具：
        - polish：当用户需要润色、优化、改写当前小说片段时调用。
        如果用户需求不需要子 Agent，就由你直接回答。
    # 润色专用的提示词。
    polish:
      prompt: |
        根据用户的需求，润色这段小说：
        用户需求：{userMsg}
        小说内容：{text}
