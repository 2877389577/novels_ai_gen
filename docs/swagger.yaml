      - Bearer: []
      summary: 查询小说详情
      tags:
      - novels
    put:
      consumes:
      - application/json
      description: 根据 ID 更新小说记录。
      parameters:
      - description: 小说 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新小说请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handler_novel.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/novel.SuccessResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "404":
          description: 小说不存在
          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/novel.ErrorBody'
      security:
      - Bearer: []
      summary: 更新小说
      tags:
      - novels
  /novels/{novel_id}/chapters:
    get:
      consumes:
      - application/json
      description: 分页查询指定小说下的章节列表，列表项不包含正文。
