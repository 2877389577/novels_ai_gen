basePath: /api/v1
definitions:
  auth.ErrorBody:
    properties:
      code:
        description: Code 表示错误响应码，使用 HTTP 状态码。
        example: 400
        type: integer
      message:
        description: Message 表示用户可理解的错误提示。
        example: 请求参数错误
        type: string
    type: object
  auth.LoginData:
    properties:
      expires_at:
        description: ExpiresAt 表示令牌过期时间。
        example: "2026-06-14T22:00:00+08:00"
        type: string
      token:
        description: Token 表示后续访问系统资源使用的 Bearer 令牌。
        example: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA
        type: string
      token_type:
        description: TokenType 表示令牌类型，固定为 Bearer。
        example: Bearer
        type: string
    type: object
  auth.LoginSuccessResponse:
    properties:
      code:
        description: Code 表示业务响应码，成功固定为 0。
        example: 0
        type: integer
      data:
        allOf:
        - $ref: '#/definitions/auth.LoginData'
        description: Data 表示登录成功后的令牌数据。
      message:
        description: Message 表示响应提示信息。
        example: ok
        type: string
    type: object
  chapter.ChapterData:
    properties:
      chapter_number:
        description: ChapterNumber 表示章节号，即“第 x 章”中的 x。
        example: 1
        type: integer
      content:
        description: Content 表示章节正文。
        example: 夜色像墨一样铺开。
        type: string
      created_at:
        description: CreatedAt 表示创建时间。
        example: "2026-06-14T22:00:00+08:00"
        type: string
      id:
        description: ID 表示章节主键 ID。
        example: 1
        type: integer
      novel_id:
        description: NovelID 表示所属小说 ID。
        example: 1
        type: integer
      title:
        description: Title 表示章节名。
        example: 初入长夜
        type: string
      updated_at:
        description: UpdatedAt 表示更新时间。
        example: "2026-06-14T22:00:00+08:00"
        type: string
      word_count:
        description: WordCount 表示正文中非空白 Unicode 字符数量。
        example: 8
        type: integer
    type: object
  chapter.ChapterSummaryData:
    properties:
      chapter_number:
        description: ChapterNumber 表示章节号，即“第 x 章”中的 x。
        example: 1
        type: integer
      created_at:
        description: CreatedAt 表示创建时间。
        example: "2026-06-14T22:00:00+08:00"
        type: string
      id:
        description: ID 表示章节主键 ID。
        example: 1
        type: integer
      novel_id:
        description: NovelID 表示所属小说 ID。
        example: 1
        type: integer
      title:
        description: Title 表示章节名。
        example: 初入长夜
        type: string
      updated_at:
        description: UpdatedAt 表示更新时间。
        example: "2026-06-14T22:00:00+08:00"
        type: string
      word_count:
        description: WordCount 表示正文中非空白 Unicode 字符数量。
        example: 8
        type: integer
    type: object
  chapter.DeleteData:
    properties:
      deleted:
        description: Deleted 表示是否已经删除。
        example: true
        type: boolean
    type: object
  chapter.DeleteSuccessResponse:
    properties:
      code:
        description: Code 表示业务响应码，成功固定为 0。
        example: 0
        type: integer
      data:
        allOf:
        - $ref: '#/definitions/chapter.DeleteData'
        description: Data 表示删除结果。
      message:
        description: Message 表示响应提示信息。
        example: ok
        type: string
    type: object
  chapter.ErrorBody:
    properties:
