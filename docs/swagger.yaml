info:
  contact: {}
  description: 小说创作应用后端接口文档。
  title: 小说创作应用 API
  version: "1.0"
paths:
  /ai/agents/chat/stream:
    post:
      consumes:
      - application/json
      description: 使用已保存 AI 提供商配置创建 Eino 写作 Agent，并以 NDJSON 流式返回模型输出。
      parameters:
      - description: 小说写作 Agent 流式对话请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handler_novelagent.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: NDJSON 流事件
          schema:
            $ref: '#/definitions/internal_api_handler_novelagent.StreamEvent'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - Bearer: []
      summary: 小说写作 Agent 流式对话
      tags:
      - ai-agents
  /ai/providers:
    get:
      consumes:
      - application/json
      description: 分页查询 AI 提供商列表，响应只包含 API Key 掩码。
      parameters:
      - default: 1
        description: 当前页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/aiprovider.ProviderListSuccessResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - Bearer: []
      summary: 查询 AI 提供商列表
      tags:
      - ai-providers
    post:
      consumes:
      - application/json
      description: 创建一条 AI 提供商记录，API Key 会加密保存且不会回显明文。
      parameters:
      - description: 创建 AI 提供商请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handler_aiprovider.CreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/aiprovider.ProviderSuccessResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "409":
          description: AI 提供商名称已存在
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - Bearer: []
      summary: 创建 AI 提供商
      tags:
      - ai-providers
  /ai/providers/{id}:
    delete:
      consumes:
      - application/json
      description: 根据 ID 删除 AI 提供商记录。
      parameters:
      - description: AI 提供商 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/aiprovider.ProviderDeleteSuccessResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "404":
          description: AI 提供商不存在
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - Bearer: []
      summary: 删除 AI 提供商
      tags:
      - ai-providers
    get:
      consumes:
      - application/json
      description: 根据 ID 查询 AI 提供商详情，响应只包含 API Key 掩码。
      parameters:
      - description: AI 提供商 ID
