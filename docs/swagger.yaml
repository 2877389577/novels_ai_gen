    properties:
      character_a_id:
        description: CharacterAID 表示无方向关系线中较小的角色卡 ID。
        example: 1
        type: integer
      character_b_id:
        description: CharacterBID 表示无方向关系线中较大的角色卡 ID。
        example: 2
        type: integer
      id:
        description: ID 表示关系线稳定 ID，由两个角色 ID 计算得到。
        example: rel-1-2
        type: string
      note:
        description: Note 表示关系线备注，用于描述两个角色之间的关系。
        example: 旧友
        type: string
    type: object
  relationship.ErrorBody:
    properties:
      code:
        description: Code 表示错误响应码，使用 HTTP 状态码。
        example: 400
        type: integer
      message:
        description: Message 表示用户可理解的错误提示。
        example: 请求参数错误
        type: string
    type: object
  relationship.GraphData:
    properties:
      edges:
        description: Edges 表示当前画布中的无方向关系线列表。
        items:
          $ref: '#/definitions/relationship.EdgeData'
        type: array
      nodes:
        description: Nodes 表示当前画布中的角色节点列表。
        items:
          $ref: '#/definitions/relationship.NodeData'
        type: array
      novel_id:
        description: NovelID 表示小说主键 ID。
        example: 1
        type: integer
      updated_at:
        description: UpdatedAt 表示关系图最后更新时间；关系图尚未保存时为空。
        example: "2026-06-15T10:00:00+08:00"
        type: string
      viewport:
        allOf:
        - $ref: '#/definitions/relationship.ViewportData'
        description: Viewport 表示画布视口。
    type: object
  relationship.NodeData:
    properties:
      character_id:
        description: CharacterID 表示画布节点引用的角色卡 ID。
        example: 1
        type: integer
      position_x:
        description: PositionX 表示节点在画布中的 X 坐标。
        example: 120
        type: number
      position_y:
        description: PositionY 表示节点在画布中的 Y 坐标。
        example: 80
        type: number
    type: object
  relationship.SuccessResponse:
    properties:
      code:
        description: Code 表示业务响应码，成功固定为 0。
        example: 0
        type: integer
      data:
        allOf:
        - $ref: '#/definitions/relationship.GraphData'
        description: Data 表示角色关系图响应数据。
      message:
        description: Message 表示响应提示信息。
        example: ok
        type: string
    type: object
  relationship.ViewportData:
    properties:
      x:
        description: X 表示画布视口 X 坐标。
        example: 0
        type: number
      "y":
        description: Y 表示画布视口 Y 坐标。
        example: 0
        type: number
      zoom:
        description: Zoom 表示画布视口缩放比例。
        example: 1
        type: number
    type: object
  response.ErrorBody:
    properties:
      code:
        description: Code 表示错误响应码，使用 HTTP 状态码。
        example: 400
        type: integer
      message:
        description: Message 表示用户可理解的错误提示。
        example: 请求参数错误
        type: string
    type: object
  upload.ErrorBody:
    properties:
      code:
        description: Code 表示错误响应码，使用 HTTP 状态码。
        example: 400
        type: integer
      message:
        description: Message 表示用户可理解的错误提示。
        example: 请求参数错误
        type: string
    type: object
  upload.PreviewData:
    properties:
      object_key:
        description: ObjectKey 表示图片保存在对象存储中的对象 key。
        example: covers/2026/06/9f1c1c0a1b2c3d4e.png
        type: string
      preview_expires_at:
        description: PreviewExpiresAt 表示预签名预览链接过期时间。
        example: "2026-06-15T22:00:00+08:00"
        type: string
      preview_url:
        description: PreviewURL 表示可直接预览私有图片的预签名链接。
        example: https://s3.example.com/bucket/covers/2026/06/example.png?X-Amz-Signature=...
        type: string
    type: object
  upload.PreviewSuccessResponse:
    properties:
      code:
        description: Code 表示业务响应码，成功固定为 0。
        example: 0
        type: integer
      data:
        allOf:
        - $ref: '#/definitions/upload.PreviewData'
        description: Data 表示刷新预览链接后的响应数据。
      message:
        description: Message 表示响应提示信息。
        example: ok
        type: string
    type: object
  upload.UploadImageData:
    properties:
      content_type:
        description: ContentType 表示根据文件内容探测出的 MIME 类型。
        example: image/png
        type: string
      object_key:
        description: ObjectKey 表示图片保存在对象存储中的对象 key。
        example: covers/2026/06/9f1c1c0a1b2c3d4e.png
        type: string
      original_filename:
        description: OriginalFilename 表示用户上传文件的原始文件名。
        example: cover.png
        type: string
      preview_expires_at:
        description: PreviewExpiresAt 表示预签名预览链接过期时间。
        example: "2026-06-15T22:00:00+08:00"
        type: string
      preview_url:
        description: PreviewURL 表示可直接预览私有图片的预签名链接。
        example: https://s3.example.com/bucket/covers/2026/06/example.png?X-Amz-Signature=...
        type: string
      size:
        description: Size 表示上传文件大小，单位为字节。
        example: 1024
        type: integer
    type: object
  upload.UploadImageSuccessResponse:
    properties:
      code:
        description: Code 表示业务响应码，成功固定为 0。
        example: 0
        type: integer
      data:
        allOf:
        - $ref: '#/definitions/upload.UploadImageData'
        description: Data 表示图片上传成功后的响应数据。
      message:
        description: Message 表示响应提示信息。
        example: ok
        type: string
    type: object
info:
  contact: {}
  description: 小说创作应用后端接口文档。
  title: 小说创作应用 API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用配置文件中的系统密码登录，成功后返回 Bearer token。
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handler_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            $ref: '#/definitions/auth.LoginSuccessResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/auth.ErrorBody'
        "401":
          description: 登录密码错误
          schema:
            $ref: '#/definitions/auth.ErrorBody'
      summary: 用户登录
      tags:
      - auth
  /config/file:
    get:
      description: 返回当前后端启动 -f 参数指定配置文件的原始文本内容。
      produces:
      - application/json
      responses:
        "200":
          description: 读取成功
          schema:
            $ref: '#/definitions/config.FileSuccessResponse'
        "401":
          description: 未登录或登录过期
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - Bearer: []
      summary: 读取后端配置文件
      tags:
      - config
    put:
      consumes:
      - application/json
      description: 保存当前后端启动 -f 参数指定配置文件的完整 YAML 文本，成功后热加载 auth.password。
      parameters:
      - description: 配置文件文本
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/config.UpdateFileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 保存成功
          schema:
            $ref: '#/definitions/config.FileSuccessResponse'
        "400":
          description: 配置内容错误
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "401":
          description: 未登录或登录过期
          schema:
            $ref: '#/definitions/response.ErrorBody'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.ErrorBody'
      security:
      - Bearer: []
      summary: 保存后端配置文件
      tags:
      - config
  /novels:
    get:
      consumes:
      - application/json
      description: 分页查询小说列表。
      parameters:
      - default: 1
        description: 当前页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/novel.ListSuccessResponse'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/novel.ErrorBody'
      security:
      - Bearer: []
      summary: 查询小说列表
      tags:
      - novels
    post:
      consumes:
      - application/json
      description: 创建一条小说记录。
      parameters:
      - description: 创建小说请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handler_novel.CreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/novel.SuccessResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/novel.ErrorBody'
      security:
      - Bearer: []
      summary: 创建小说
      tags:
      - novels
  /novels/{id}:
    delete:
      consumes:
      - application/json
      description: 根据 ID 真删小说记录。
      parameters:
      - description: 小说 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
