basePath: /api/v1
definitions:
  auth.ErrorBody:
    properties:
      code:
        description: Code 表示错误响应码，使用 HTTP 状态码。
        example: 400
        type: integer
      message:
        description: Message 表示用户可理解的错误提示。
        example: 请求参数错误
        type: string
    type: object
  auth.LoginData:
    properties:
      expires_at:
        description: ExpiresAt 表示令牌过期时间。
        example: "2026-06-14T22:00:00+08:00"
        type: string
      token:
        description: Token 表示后续访问系统资源使用的 Bearer 令牌。
        example: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA
        type: string
      token_type:
        description: TokenType 表示令牌类型，固定为 Bearer。
        example: Bearer
        type: string
    type: object
  auth.LoginSuccessResponse:
    properties:
      code:
        description: Code 表示业务响应码，成功固定为 0。
        example: 0
        type: integer
      data:
        allOf:
        - $ref: '#/definitions/auth.LoginData'
        description: Data 表示登录成功后的令牌数据。
      message:
        description: Message 表示响应提示信息。
        example: ok
        type: string
    type: object
  internal_api_handler_auth.LoginRequest:
    properties:
      password:
        description: Password 表示系统登录密码。
        example: admin123
        type: string
    required:
    - password
    type: object
  internal_api_handler_novel.CreateRequest:
    properties:
      author_name:
        description: AuthorName 表示作者名，可以为空。
        example: 爱潜水的乌贼
        type: string
      cover_url:
        description: CoverURL 表示封面链接，可以为空。
        example: https://example.com/cover.jpg
        type: string
      description:
        description: Description 表示简介，可以为空。
        example: 一部关于废土冒险的小说
        type: string
      name:
        description: Name 表示小说名，不能为空。
        example: 长夜余火
        type: string
      tags:
        description: Tags 表示标签，可以为空，多个标签使用英文逗号分隔。
        example: 玄幻,冒险
        type: string
    required:
    - name
    type: object
  internal_api_handler_novel.UpdateRequest:
    properties:
      author_name:
        description: AuthorName 表示作者名，可以为空。
        example: 爱潜水的乌贼
        type: string
      cover_url:
        description: CoverURL 表示封面链接，可以为空。
        example: https://example.com/cover.jpg
        type: string
      description:
        description: Description 表示简介，可以为空。
        example: 一部关于废土冒险的小说
        type: string
      name:
        description: Name 表示小说名，不能为空。
        example: 长夜余火
        type: string
      tags:
        description: Tags 表示标签，可以为空，多个标签使用英文逗号分隔。
        example: 玄幻,冒险
        type: string
    required:
    - name
    type: object
  novel.DeleteData:
    properties:
      deleted:
        description: Deleted 表示是否已经删除。
        example: true
        type: boolean
    type: object
  novel.DeleteSuccessResponse:
    properties:
      code:
        description: Code 表示业务响应码，成功固定为 0。
        example: 0
        type: integer
      data:
        allOf:
        - $ref: '#/definitions/novel.DeleteData'
        description: Data 表示删除结果。
      message:
        description: Message 表示响应提示信息。
        example: ok
        type: string
    type: object
  novel.ErrorBody:
    properties:
      code:
        description: Code 表示错误响应码，使用 HTTP 状态码。
        example: 400
        type: integer
      message:
        description: Message 表示用户可理解的错误提示。
        example: 请求参数错误
        type: string
    type: object
  novel.ListData:
    properties:
      items:
        description: Items 表示当前页小说列表。
        items:
          $ref: '#/definitions/novel.NovelData'
        type: array
      page:
        description: Page 表示当前页码。
        example: 1
        type: integer
      page_size:
        description: PageSize 表示每页数量。
        example: 20
        type: integer
      total:
        description: Total 表示符合条件的小说总数。
        example: 1
        type: integer
    type: object
  novel.ListSuccessResponse:
    properties:
      code:
        description: Code 表示业务响应码，成功固定为 0。
        example: 0
        type: integer
      data:
        allOf:
        - $ref: '#/definitions/novel.ListData'
        description: Data 表示小说分页列表响应数据。
      message:
        description: Message 表示响应提示信息。
        example: ok
        type: string
    type: object
  novel.NovelData:
    properties:
      author_name:
        description: AuthorName 表示作者名。
        example: 爱潜水的乌贼
        type: string
      cover_url:
        description: CoverURL 表示封面链接。
        example: https://example.com/cover.jpg
        type: string
      created_at:
        description: CreatedAt 表示创建时间。
        example: "2026-06-13T22:00:00+08:00"
        type: string
      description:
        description: Description 表示简介。
        example: 一部关于废土冒险的小说
        type: string
      id:
        description: ID 表示小说主键 ID。
        example: 1
        type: integer
      name:
        description: Name 表示小说名。
        example: 长夜余火
        type: string
      tags:
        description: Tags 表示标签，多个标签使用英文逗号分隔。
        example: 玄幻,冒险
        type: string
      updated_at:
        description: UpdatedAt 表示更新时间。
        example: "2026-06-13T22:00:00+08:00"
        type: string
    type: object
  novel.SuccessResponse:
    properties:
      code:
        description: Code 表示业务响应码，成功固定为 0。
        example: 0
        type: integer
      data:
        allOf:
        - $ref: '#/definitions/novel.NovelData'
        description: Data 表示小说响应数据。
      message:
        description: Message 表示响应提示信息。
        example: ok
        type: string
    type: object
  upload.ErrorBody:
    properties:
      code:
        description: Code 表示错误响应码，使用 HTTP 状态码。
        example: 400
        type: integer
      message:
        description: Message 表示用户可理解的错误提示。
        example: 请求参数错误
        type: string
    type: object
  upload.PreviewData:
    properties:
      object_key:
        description: ObjectKey 表示图片保存在对象存储中的对象 key。
        example: covers/2026/06/9f1c1c0a1b2c3d4e.png
        type: string
      preview_expires_at:
        description: PreviewExpiresAt 表示预签名预览链接过期时间。
        example: "2026-06-15T22:00:00+08:00"
        type: string
      preview_url:
        description: PreviewURL 表示可直接预览私有图片的预签名链接。
        example: https://s3.example.com/bucket/covers/2026/06/example.png?X-Amz-Signature=...
        type: string
    type: object
  upload.PreviewSuccessResponse:
    properties:
      code:
        description: Code 表示业务响应码，成功固定为 0。
        example: 0
        type: integer
      data:
        allOf:
        - $ref: '#/definitions/upload.PreviewData'
        description: Data 表示刷新预览链接后的响应数据。
      message:
        description: Message 表示响应提示信息。
        example: ok
        type: string
    type: object
  upload.UploadImageData:
    properties:
      content_type:
        description: ContentType 表示根据文件内容探测出的 MIME 类型。
        example: image/png
        type: string
      object_key:
        description: ObjectKey 表示图片保存在对象存储中的对象 key。
        example: covers/2026/06/9f1c1c0a1b2c3d4e.png
        type: string
      original_filename:
        description: OriginalFilename 表示用户上传文件的原始文件名。
        example: cover.png
        type: string
      preview_expires_at:
        description: PreviewExpiresAt 表示预签名预览链接过期时间。
        example: "2026-06-15T22:00:00+08:00"
        type: string
      preview_url:
        description: PreviewURL 表示可直接预览私有图片的预签名链接。
        example: https://s3.example.com/bucket/covers/2026/06/example.png?X-Amz-Signature=...
        type: string
      size:
        description: Size 表示上传文件大小，单位为字节。
        example: 1024
        type: integer
    type: object
  upload.UploadImageSuccessResponse:
    properties:
      code:
        description: Code 表示业务响应码，成功固定为 0。
        example: 0
        type: integer
      data:
        allOf:
        - $ref: '#/definitions/upload.UploadImageData'
        description: Data 表示图片上传成功后的响应数据。
      message:
        description: Message 表示响应提示信息。
        example: ok
        type: string
    type: object
info:
  contact: {}
  description: 小说创作应用后端接口文档。
  title: 小说创作应用 API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用配置文件中的系统密码登录，成功后返回 Bearer token。
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handler_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            $ref: '#/definitions/auth.LoginSuccessResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/auth.ErrorBody'
        "401":
          description: 登录密码错误
          schema:
            $ref: '#/definitions/auth.ErrorBody'
      summary: 用户登录
      tags:
      - auth
  /novels:
    get:
      consumes:
      - application/json
      description: 分页查询小说列表。
      parameters:
      - default: 1
        description: 当前页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/novel.ListSuccessResponse'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/novel.ErrorBody'
      security:
      - Bearer: []
      summary: 查询小说列表
      tags:
      - novels
    post:
      consumes:
      - application/json
      description: 创建一条小说记录。
      parameters:
      - description: 创建小说请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handler_novel.CreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/novel.SuccessResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/novel.ErrorBody'
      security:
      - Bearer: []
      summary: 创建小说
      tags:
      - novels
  /novels/{id}:
    delete:
      consumes:
      - application/json
      description: 根据 ID 真删小说记录。
      parameters:
      - description: 小说 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/novel.DeleteSuccessResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "404":
          description: 小说不存在
          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/novel.ErrorBody'
      security:
      - Bearer: []
      summary: 删除小说
      tags:
      - novels
    get:
      consumes:
      - application/json
      description: 根据 ID 查询小说详情。
      parameters:
      - description: 小说 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/novel.SuccessResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "404":
          description: 小说不存在
          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/novel.ErrorBody'
      security:
      - Bearer: []
      summary: 查询小说详情
      tags:
      - novels
    put:
      consumes:
      - application/json
      description: 根据 ID 更新小说记录。
      parameters:
      - description: 小说 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新小说请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api_handler_novel.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/novel.SuccessResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "404":
          description: 小说不存在
          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/novel.ErrorBody'
      security:
      - Bearer: []
      summary: 更新小说
      tags:
      - novels
  /uploads/images:
    post:
      consumes:
      - multipart/form-data
      description: 上传小说封面或人物图片到私有对象存储，并返回对象 key 和预签名预览链接。
      parameters:
      - description: 图片文件
        in: formData
        name: file
        required: true
        type: file
      - description: 图片用途
        enum:
        - cover
        - character
        in: formData
        name: usage
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 上传成功
          schema:
            $ref: '#/definitions/upload.UploadImageSuccessResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/upload.ErrorBody'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/upload.ErrorBody'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/upload.ErrorBody'
      security:
      - Bearer: []
      summary: 上传图片
      tags:
      - uploads
  /uploads/preview:
    get:
      consumes:
      - application/json
      description: 根据对象 key 生成新的私有图片预签名预览链接。
      parameters:
      - description: 对象 key
        in: query
        name: object_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            $ref: '#/definitions/upload.PreviewSuccessResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/upload.ErrorBody'
        "401":
          description: 未登录或登录已过期
          schema:
            $ref: '#/definitions/upload.ErrorBody'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/upload.ErrorBody'
      security:
      - Bearer: []
      summary: 刷新图片预览链接
      tags:
      - uploads
schemes:
- http
- https
securityDefinitions:
  Bearer:
    description: 输入 Bearer token，例如：Bearer <token>
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
