basePath: /api/v1
definitions:
  aiprovider.ModelData:
    properties:
      created_at:
        description: CreatedAt 表示模型创建时间。
        example: "2026-06-18T12:00:00Z"
        type: string
      display_name:
        description: DisplayName 表示模型展示名称。
        example: GPT-5
        type: string
      id:
        description: ID 表示模型标识。
        example: gpt-5
        type: string
      owned_by:
        description: OwnedBy 表示模型归属方。
        example: openai
        type: string
      supported_generation_methods:
        description: SupportedGenerationMethods 表示模型支持的生成能力。
        items:
          type: string
        type: array
    type: object
  aiprovider.ModelListData:
    properties:
      items:
        description: Items 表示模型列表。
        items:
          $ref: '#/definitions/aiprovider.ModelData'
        type: array
    type: object
  aiprovider.ModelListSuccessResponse:
    properties:
      code:
        description: Code 表示业务响应码，成功固定为 0。
        example: 0
        type: integer
      data:
        allOf:
        - $ref: '#/definitions/aiprovider.ModelListData'
        description: Data 表示模型列表响应数据。
      message:
        description: Message 表示响应提示信息。
        example: ok
        type: string
      request_id:
        description: RequestID 表示本次请求的追踪标识。
        example: 8f2d6c6d0cf2473e9f8e24d9d0ab3d81
        type: string
    type: object
  aiprovider.ProviderData:
    properties:
      api_type:
        description: APIType 表示 AI 接口类型。
        example: completions
        type: string
      base_url:
        description: BaseURL 表示 AI 提供商接口基础地址。
        example: https://api.openai.com/v1
        type: string
      created_at:
        description: CreatedAt 表示创建时间。
        example: "2026-06-18T12:00:00+08:00"
        type: string
      default_model:
        description: DefaultModel 表示模型列表不可用时使用的默认模型标识。
        example: gpt-5
        type: string
      enabled:
        description: Enabled 表示是否启用该 AI 提供商。
        example: true
        type: boolean
      id:
        description: ID 表示 AI 提供商主键 ID。
        example: 1
        type: integer
      masked_api_key:
        description: MaskedAPIKey 表示 API Key 掩码。
        example: sk-p...abcd
        type: string
      name:
        description: Name 表示 AI 提供商名称。
        example: 默认 OpenAI
        type: string
      priority:
        description: Priority 表示 AI 提供商排序优先级，0 最低，数值越大优先级越高。
        example: 1
        type: integer
      provider_type:
        description: ProviderType 表示 AI 提供商类型。
        example: openai
        type: string
      updated_at:
        description: UpdatedAt 表示更新时间。
        example: "2026-06-18T12:00:00+08:00"
        type: string
    type: object
  aiprovider.ProviderDeleteData:
    properties:
      deleted:
        description: Deleted 表示是否已经删除。
        example: true
        type: boolean
    type: object
  aiprovider.ProviderDeleteSuccessResponse:
    properties:
      code:
        description: Code 表示业务响应码，成功固定为 0。
        example: 0
        type: integer
      data:
        allOf:
        - $ref: '#/definitions/aiprovider.ProviderDeleteData'
        description: Data 表示删除结果。
      message:
        description: Message 表示响应提示信息。
        example: ok
