          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "404":
          description: 小说不存在
          schema:
            $ref: '#/definitions/novel.ErrorBody'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/novel.ErrorBody'
      security:
      - Bearer: []
      summary: 删除小说
      tags:
      - novels
    get:
      consumes:
      - application/json
      description: 根据 ID 查询小说详情。
      parameters:
      - description: 小说 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
